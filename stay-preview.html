<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Places to Stay — Preview</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>body,html{margin:0;padding:0;background:#edf3f7;} .leaflet-container{border-radius:0;} </style>
</head>
<body>
  <div id="root"></div>
  <!-- Preview only: renders the "Places to Stay" section from index.html without the login screen. -->
  <script>
    fetch("index.html").then(r => r.text()).then(html => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const source = doc.getElementById("app-source").textContent.replace(
        /ReactDOM\.createRoot[\s\S]*$/,
        `ReactDOM.createRoot(document.getElementById('root')).render(
          <div className="app">
            <style>{css}</style>
            <div className="card visible"><Corners/><StayOptions/></div>
          </div>
        );`
      );
      const script = document.createElement("script");
      script.text = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
